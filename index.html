<!DOCTYPE html>

<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Отчёт по водителям
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            background: #f5f7fb;

            color: #20242c;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

        }


        .container {

            max-width: 1500px;

            margin: 0 auto;

            padding:
                35px 20px 50px;

        }


        h1 {

            margin:
                0 0 25px;

            font-size: 30px;

            font-weight: 700;

        }


        .card {

            background: white;

            border-radius: 16px;

            padding: 25px;

            margin-bottom: 20px;

            box-shadow:
                0 4px 20px
                rgba(0, 0, 0, .06);

        }


        /* ====================================================
           ФИЛЬТРЫ
           ==================================================== */

        .filters {

            display: flex;

            align-items: end;

            gap: 15px;

            flex-wrap: wrap;

        }


        .field {

            display: flex;

            flex-direction: column;

            gap: 7px;

        }


        .field label {

            font-size: 13px;

            color: #6b7280;

            font-weight: 600;

        }


        input[type="date"],
        select {

            height: 44px;

            padding:
                0 12px;

            border:
                1px solid #d8dce5;

            border-radius: 9px;

            background: white;

            font-size: 15px;

            color: #20242c;

            min-width: 200px;

        }


        input[type="date"]:focus,
        select:focus {

            outline: none;

            border-color: #2563eb;

        }


        /* ====================================================
           КНОПКИ
           ==================================================== */

        button {

            height: 44px;

            padding:
                0 22px;

            border: 0;

            border-radius: 9px;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            transition:
                background .15s,
                opacity .15s;

        }


        #loadBtn {

            background: #2563eb;

            color: white;

        }


        #loadBtn:hover {

            background: #1d4ed8;

        }


        #excelBtn {

            display: none;

            background: #16a34a;

            color: white;

        }


        #excelBtn:hover {

            background: #15803d;

        }


        #resetBtn {

            background: #eef0f4;

            color: #374151;

            display: none;

        }


        #resetBtn:hover {

            background: #e2e5ea;

        }


        button:disabled {

            opacity: .6;

            cursor: wait;

        }


        /* ====================================================
           СТАТУС
           ==================================================== */

        .status {

            margin-top: 18px;

            font-size: 14px;

            color: #6b7280;

        }


        /* ====================================================
           SUMMARY
           ==================================================== */

        .summary {

            display: none;

            gap: 15px;

            margin-top: 20px;

            flex-wrap: wrap;

        }


        .summary-item {

            min-width: 180px;

            padding:
                15px 20px;

            background: #f5f7fb;

            border-radius: 10px;

        }


        .summary-title {

            color: #6b7280;

            font-size: 13px;

        }


        .summary-value {

            margin-top: 5px;

            font-size: 22px;

            font-weight: 700;

        }


        /* ====================================================
           БЛОК ФИЛЬТРОВ ПО ДАННЫМ
           ==================================================== */

        .data-filters {

            display: none;

            grid-template-columns:
                repeat(2, minmax(200px, 1fr));

            gap: 15px;

            margin-top: 25px;

            padding-top: 25px;

            border-top:
                1px solid #edf0f4;

        }


        .filter-title {

            grid-column:
                1 / -1;

            font-size: 16px;

            font-weight: 700;

            margin-bottom: 2px;

        }


        /* ====================================================
           ТАБЛИЦА
           ==================================================== */

        .table-wrap {

            overflow-x: auto;

        }


        table {

            width: 100%;

            border-collapse: collapse;

            font-size: 14px;

            min-width: 1100px;

        }


        th {

            padding:
                13px;

            background: #f3f4f6;

            text-align: left;

            white-space: nowrap;

            font-weight: 600;

        }


        td {

            padding:
                12px 13px;

            border-top:
                1px solid #edf0f4;

            vertical-align: top;

        }


        tbody tr:hover td {

            background: #fafafa;

        }


        /* ====================================================
           ИТОГО
           ==================================================== */

        tfoot td {

            padding:
                15px 13px;

            border-top:
                2px solid #cfd4dc;

            background: #f3f4f6;

            font-weight: 700;

            white-space: nowrap;

        }


        .total-label {

            font-size: 15px;

        }


        .positive {

            color: #15803d;

            font-weight: 600;

        }


        .negative {

            color: #dc2626;

            font-weight: 600;

        }


        .empty {

            text-align: center;

            padding: 50px;

            color: #9ca3af;

        }


        /* ====================================================
           LOADER
           ==================================================== */

        .loader {

            display: inline-block;

            width: 15px;

            height: 15px;

            margin-right: 7px;

            border:
                2px solid
                rgba(255, 255, 255, .4);

            border-top-color: white;

            border-radius: 50%;

            animation:
                spin .7s linear infinite;

            vertical-align: -2px;

        }


        @keyframes spin {

            to {

                transform:
                    rotate(360deg);

            }

        }


        /* ====================================================
           МОБИЛЬНАЯ ВЕРСИЯ
           ==================================================== */

        @media (max-width: 700px) {

            .container {

                padding:
                    20px 12px;

            }


            .filters {

                flex-direction: column;

                align-items: stretch;

            }


            .field,
            input,
            select,
            button {

                width: 100%;

            }


            .data-filters {

                grid-template-columns: 1fr;

            }


            .summary {

                flex-direction: column;

            }


            .summary-item {

                width: 100%;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- ====================================================
         ЗАГОЛОВОК
         ==================================================== -->

    <h1>
        Отчёт по водителям
    </h1>


    <!-- ====================================================
         ОСНОВНОЙ ФИЛЬТР ПЕРИОДА
         ==================================================== -->

    <div class="card">


        <div class="filters">


            <!-- Дата начала -->

            <div class="field">

                <label>
                    Дата начала
                </label>

                <input
                    type="date"
                    id="from"
                >

            </div>


            <!-- Дата окончания -->

            <div class="field">

                <label>
                    Дата окончания
                </label>

                <input
                    type="date"
                    id="to"
                >

            </div>


            <!-- Получить -->

            <button
                id="loadBtn"
                onclick="loadReport()"
            >

                Получить отчёт

            </button>


            <!-- Excel -->

            <button
                id="excelBtn"
                onclick="downloadExcel()"
            >

                Скачать Excel

            </button>


            <!-- Сбросить фильтры -->

            <button
                id="resetBtn"
                onclick="resetFilters()"
            >

                Сбросить фильтры

            </button>


        </div>


        <!-- =================================================
             ФИЛЬТРЫ КОНТРАГЕНТ / ВОДИТЕЛЬ
             ================================================= -->

        <div
            class="data-filters"
            id="dataFilters"
        >


            <div class="filter-title">

                Фильтр отчёта

            </div>


            <!-- Контрагент -->

            <div class="field">

                <label>
                    Контрагент
                </label>

                <select
                    id="counterpartyFilter"
                    onchange="applyFilters()"
                >

                    <option value="">
                        Все контрагенты
                    </option>

                </select>

            </div>


            <!-- Водитель -->

            <div class="field">

                <label>
                    Водитель
                </label>

                <select
                    id="driverFilter"
                    onchange="applyFilters()"
                >

                    <option value="">
                        Все водители
                    </option>

                </select>

            </div>


        </div>


        <!-- =================================================
             СТАТУС
             ================================================= -->

        <div
            class="status"
            id="status"
        ></div>


        <!-- =================================================
             ИТОГОВЫЕ ПОКАЗАТЕЛИ
             ================================================= -->

        <div
            class="summary"
            id="summary"
        >


            <div class="summary-item">

                <div class="summary-title">

                    Строк

                </div>

                <div
                    class="summary-value"
                    id="count"
                >

                    0

                </div>

            </div>


            <div class="summary-item">

                <div class="summary-title">

                    Сумма счета

                </div>

                <div
                    class="summary-value"
                    id="totalInvoice"
                >

                    0,00 ₽

                </div>

            </div>


            <div class="summary-item">

                <div class="summary-title">

                    Сумма отгрузок

                </div>

                <div
                    class="summary-value"
                    id="totalShipment"
                >

                    0,00 ₽

                </div>

            </div>


            <div class="summary-item">

                <div class="summary-title">

                    Разница

                </div>

                <div
                    class="summary-value"
                    id="totalDifference"
                >

                    0,00 ₽

                </div>

            </div>


        </div>


    </div>


    <!-- ====================================================
         ТАБЛИЦА
         ==================================================== -->

    <div class="card">


        <div class="table-wrap">


            <table>


                <thead>

                    <tr>

                        <th>
                            Дата
                        </th>

                        <th>
                            Контрагент
                        </th>

                        <th>
                            Водитель
                        </th>

                        <th>
                            Счёт
                        </th>

                        <th>
                            Сумма счета
                        </th>

                        <th>
                            Сумма отгрузок
                        </th>

                        <th>
                            Разница
                        </th>

                        <th>
                            Отгрузки
                        </th>

                    </tr>

                </thead>


                <tbody
                    id="tableBody"
                >


                    <tr>

                        <td
                            colspan="8"
                            class="empty"
                        >

                            Выберите период и нажмите
                            «Получить отчёт»

                        </td>

                    </tr>


                </tbody>


                <!-- =================================================
                     ИТОГО
                     ================================================= -->

                <tfoot
                    id="tableFooter"
                    style="display:none"
                >

                    <tr>

                        <td
                            colspan="4"
                            class="total-label"
                        >

                            ИТОГО

                        </td>


                        <td
                            id="footerInvoice"
                        >

                            0,00 ₽

                        </td>


                        <td
                            id="footerShipment"
                        >

                            0,00 ₽

                        </td>


                        <td
                            id="footerDifference"
                        >

                            0,00 ₽

                        </td>


                        <td>

                        </td>

                    </tr>

                </tfoot>


            </table>


        </div>


    </div>


</div>


<script>


// ============================================================
// ДАННЫЕ
// ============================================================

// Полный отчёт, полученный от сервера
let currentReport = [];


// Отфильтрованный отчёт
let filteredReport = [];


// ============================================================
// ЭЛЕМЕНТЫ
// ============================================================

const fromInput =
    document.getElementById('from');

const toInput =
    document.getElementById('to');

const loadBtn =
    document.getElementById('loadBtn');

const excelBtn =
    document.getElementById('excelBtn');

const resetBtn =
    document.getElementById('resetBtn');

const status =
    document.getElementById('status');

const summary =
    document.getElementById('summary');

const count =
    document.getElementById('count');

const totalInvoice =
    document.getElementById('totalInvoice');

const totalShipment =
    document.getElementById('totalShipment');

const totalDifference =
    document.getElementById('totalDifference');

const tableBody =
    document.getElementById('tableBody');

const tableFooter =
    document.getElementById('tableFooter');

const footerInvoice =
    document.getElementById('footerInvoice');

const footerShipment =
    document.getElementById('footerShipment');

const footerDifference =
    document.getElementById('footerDifference');

const dataFilters =
    document.getElementById('dataFilters');

const counterpartyFilter =
    document.getElementById(
        'counterpartyFilter'
    );

const driverFilter =
    document.getElementById(
        'driverFilter'
    );


// ============================================================
// ДАТА СЕГОДНЯ
// ============================================================

const today =
    new Date();


const todayString =
    today.toISOString()
        .substring(0, 10);


// ============================================================
// ПЕРВЫЙ ДЕНЬ ТЕКУЩЕГО МЕСЯЦА
// ============================================================

const firstDay =
    new Date(
        today.getFullYear(),
        today.getMonth(),
        1
    );


const firstDayString =
    firstDay
        .toISOString()
        .substring(0, 10);


// ============================================================
// ЗНАЧЕНИЯ ПО УМОЛЧАНИЮ
// ============================================================

fromInput.value =
    firstDayString;

toInput.value =
    todayString;


// ============================================================
// ПОЛУЧИТЬ ОТЧЁТ
// ============================================================

async function loadReport() {


    const from =
        fromInput.value;

    const to =
        toInput.value;


    // --------------------------------------------------------
    // Проверки
    // --------------------------------------------------------

    if (!from || !to) {

        alert(
            'Выберите период'
        );

        return;

    }


    if (from > to) {

        alert(
            'Дата начала не может быть позже даты окончания'
        );

        return;

    }


    // --------------------------------------------------------
    // Сбрасываем предыдущий отчёт
    // --------------------------------------------------------

    currentReport = [];

    filteredReport = [];


    // --------------------------------------------------------
    // UI
    // --------------------------------------------------------

    loadBtn.disabled =
        true;

    excelBtn.style.display =
        'none';

    resetBtn.style.display =
        'none';

    dataFilters.style.display =
        'none';

    summary.style.display =
        'none';

    tableFooter.style.display =
        'none';


    loadBtn.innerHTML =
        '<span class="loader"></span>Загрузка...';


    status.textContent =
        'Получаем данные из МойСклад...';


    tableBody.innerHTML = `

        <tr>

            <td
                colspan="8"
                class="empty"
            >

                Загрузка данных...

            </td>

        </tr>

    `;


    try {


        // ====================================================
        // ЗАПРОС
        // ====================================================

        const url =
            `/api/driver-report?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`;


        const response =
            await fetch(url);


        const data =
            await response.json();


        // ====================================================
        // ОШИБКА
        // ====================================================

        if (!response.ok) {

            throw new Error(
                extractError(data)
            );

        }


        // ====================================================
        // СОХРАНЯЕМ ПОЛНЫЙ ОТЧЁТ
        // ====================================================

        currentReport =
            data.rows || [];


        // Изначально показываем всё
        filteredReport =
            [...currentReport];


        // ====================================================
        // СОЗДАЁМ СПИСКИ ФИЛЬТРОВ
        // ====================================================

        buildFilters();


        // ====================================================
        // ПОКАЗЫВАЕМ ФИЛЬТРЫ
        // ====================================================

        dataFilters.style.display =
            'grid';


        // ====================================================
        // ПОКАЗЫВАЕМ ОТЧЁТ
        // ====================================================

        renderReport(
            filteredReport
        );


        // ====================================================
        // КНОПКИ
        // ====================================================

        if (
            currentReport.length > 0
        ) {

            excelBtn.style.display =
                'inline-block';

            resetBtn.style.display =
                'inline-block';

        }


        status.textContent =
            `Период: ${formatDate(from)} — ${formatDate(to)}`;


    } catch (error) {


        console.error(
            error
        );


        currentReport = [];

        filteredReport = [];


        tableBody.innerHTML = `

            <tr>

                <td
                    colspan="8"
                    class="empty"
                >

                    Ошибка:

                    ${escapeHtml(
                        error.message
                    )}

                </td>

            </tr>

        `;


        status.textContent =
            'Ошибка получения данных';


    } finally {


        loadBtn.disabled =
            false;


        loadBtn.textContent =
            'Получить отчёт';

    }

}


// ============================================================
// СОЗДАТЬ ФИЛЬТРЫ
// ============================================================

function buildFilters() {


    // --------------------------------------------------------
    // Контрагенты
    // --------------------------------------------------------

    const counterparties =

        [
            ...new Set(

                currentReport
                    .map(
                        row =>
                            row.counterparty
                    )
                    .filter(Boolean)

            )
        ]

        .sort(
            (a, b) =>
                a.localeCompare(
                    b,
                    'ru'
                )
        );


    counterpartyFilter.innerHTML = `

        <option value="">
            Все контрагенты
        </option>

    `;


    for (
        const counterparty
        of counterparties
    ) {

        const option =
            document.createElement(
                'option'
            );


        option.value =
            counterparty;


        option.textContent =
            counterparty;


        counterpartyFilter.appendChild(
            option
        );

    }


    // --------------------------------------------------------
    // Водители
    // --------------------------------------------------------

    const drivers =
        new Set();


    for (
        const row
        of currentReport
    ) {

        const driverString =
            String(
                row.driver || ''
            );


        driverString
            .split(',')
            .map(
                driver =>
                    driver.trim()
            )
            .filter(Boolean)
            .forEach(
                driver =>
                    drivers.add(driver)
            );

    }


    const sortedDrivers =
        [...drivers]
            .sort(
                (a, b) =>
                    a.localeCompare(
                        b,
                        'ru'
                    )
            );


    driverFilter.innerHTML = `

        <option value="">
            Все водители
        </option>

    `;


    for (
        const driver
        of sortedDrivers
    ) {

        const option =
            document.createElement(
                'option'
            );


        option.value =
            driver;


        option.textContent =
            driver;


        driverFilter.appendChild(
            option
        );

    }

}


// ============================================================
// ПРИМЕНИТЬ ФИЛЬТРЫ
// ============================================================

function applyFilters() {


    const selectedCounterparty =
        counterpartyFilter.value;


    const selectedDriver =
        driverFilter.value;


    // --------------------------------------------------------
    // Фильтруем исходный отчёт
    // --------------------------------------------------------

    filteredReport =
        currentReport.filter(
            row => {


                // --------------------------------------------
                // Контрагент
                // --------------------------------------------

                const counterpartyOk =

                    !selectedCounterparty ||

                    row.counterparty ===
                        selectedCounterparty;


                // --------------------------------------------
                // Водитель
                //
                // Используем includes,
                // потому что в строке может быть
                // несколько водителей.
                // --------------------------------------------

                const driverOk =

                    !selectedDriver ||

                    String(
                        row.driver || ''
                    )
                    .split(',')
                    .map(
                        d => d.trim()
                    )
                    .includes(
                        selectedDriver
                    );


                return (
                    counterpartyOk &&
                    driverOk
                );

            }
        );


    // --------------------------------------------------------
    // Перерисовываем
    // --------------------------------------------------------

    renderReport(
        filteredReport
    );


    // --------------------------------------------------------
    // Статус
    // --------------------------------------------------------

    const total =
        currentReport.length;

    const visible =
        filteredReport.length;


    status.textContent =
        `Показано ${visible} из ${total} строк`;


}


// ============================================================
// СБРОСИТЬ ФИЛЬТРЫ
// ============================================================

function resetFilters() {


    counterpartyFilter.value =
        '';

    driverFilter.value =
        '';


    filteredReport =
        [...currentReport];


    renderReport(
        filteredReport
    );


    status.textContent =
        `Показано ${currentReport.length} строк`;

}


// ============================================================
// ОТОБРАЗИТЬ ОТЧЁТ
// ============================================================

function renderReport(rows) {


    // ========================================================
    // ПУСТО
    // ========================================================

    if (!rows.length) {


        tableBody.innerHTML = `

            <tr>

                <td
                    colspan="8"
                    class="empty"
                >

                    По выбранным фильтрам
                    данных нет

                </td>

            </tr>

        `;


        // Сбрасываем итоги

        updateTotals([]);


        tableFooter.style.display =
            'none';


        return;

    }


    // ========================================================
    // ТАБЛИЦА
    // ========================================================

    tableBody.innerHTML =

        rows
            .map(
                row => {


                    const difference =
                        Number(
                            row.difference || 0
                        );


                    let differenceClass =
                        '';


                    if (
                        difference > 0
                    ) {

                        differenceClass =
                            'positive';

                    }


                    if (
                        difference < 0
                    ) {

                        differenceClass =
                            'negative';

                    }


                    // ----------------------------------------
                    // Отгрузки
                    // ----------------------------------------

                    const demands =
                        (row.demands || [])
                            .map(
                                demand => `

                                    <div>

                                        ${escapeHtml(
                                            demand.number
                                        )}

                                        —

                                        ${formatMoney(
                                            demand.sum
                                        )}

                                    </div>

                                `
                            )
                            .join('');


                    return `

                        <tr>

                            <td>

                                ${formatDate(
                                    row.date
                                )}

                            </td>


                            <td>

                                ${escapeHtml(
                                    row.counterparty
                                )}

                            </td>


                            <td>

                                ${escapeHtml(
                                    row.driver
                                )}

                            </td>


                            <td>

                                ${escapeHtml(
                                    row.invoice
                                )}

                            </td>


                            <td>

                                ${formatMoney(
                                    row.invoiceSum
                                )}

                            </td>


                            <td>

                                ${formatMoney(
                                    row.shipmentSum
                                )}

                            </td>


                            <td
                                class="${differenceClass}"
                            >

                                ${formatMoney(
                                    difference
                                )}

                            </td>


                            <td>

                                ${demands}

                            </td>

                        </tr>

                    `;

                }
            )
            .join('');


    // ========================================================
    // ИТОГИ
    // ========================================================

    updateTotals(
        rows
    );


    tableFooter.style.display =
        'table-footer-group';

}


// ============================================================
// ПОСЧИТАТЬ ИТОГИ
// ============================================================

function updateTotals(rows) {


    let invoiceTotal =
        0;


    let shipmentTotal =
        0;


    let differenceTotal =
        0;


    for (
        const row
        of rows
    ) {

        invoiceTotal +=
            Number(
                row.invoiceSum || 0
            );


        shipmentTotal +=
            Number(
                row.shipmentSum || 0
            );


        differenceTotal +=
            Number(
                row.difference || 0
            );

    }


    // --------------------------------------------------------
    // Summary сверху
    // --------------------------------------------------------

    count.textContent =
        rows.length;


    totalInvoice.textContent =
        formatMoney(
            invoiceTotal
        );


    totalShipment.textContent =
        formatMoney(
            shipmentTotal
        );


    totalDifference.textContent =
        formatMoney(
            differenceTotal
        );


    summary.style.display =
        'flex';


    // --------------------------------------------------------
    // ИТОГО под таблицей
    // --------------------------------------------------------

    footerInvoice.textContent =
        formatMoney(
            invoiceTotal
        );


    footerShipment.textContent =
        formatMoney(
            shipmentTotal
        );


    footerDifference.textContent =
        formatMoney(
            differenceTotal
        );


    // --------------------------------------------------------
    // Цвет разницы
    // --------------------------------------------------------

    footerDifference.className =
        '';


    if (
        differenceTotal > 0
    ) {

        footerDifference.className =
            'positive';

    }


    if (
        differenceTotal < 0
    ) {

        footerDifference.className =
            'negative';

    }

}


// ============================================================
// СКАЧАТЬ EXCEL
//
// ВАЖНО:
//
// Отправляем именно filteredReport,
// а не currentReport.
//
// Поэтому Excel содержит только
// выбранные фильтрами строки.
// ============================================================

async function downloadExcel() {


    if (
        !filteredReport.length
    ) {

        alert(
            'Нет данных для скачивания'
        );

        return;

    }


    const from =
        fromInput.value;

    const to =
        toInput.value;


    try {


        excelBtn.disabled =
            true;


        excelBtn.textContent =
            'Формируем Excel...';


        // ====================================================
        // POST
        // ====================================================

        const response =
            await fetch(
                '/api/driver-report.xlsx',
                {

                    method:
                        'POST',

                    headers: {

                        'Content-Type':
                            'application/json'

                    },

                    body:
                        JSON.stringify({

                            from,

                            to,

                            rows:
                                filteredReport

                        })

                }
            );


        // ====================================================
        // Ошибка
        // ====================================================

        if (!response.ok) {


            let errorData;


            try {

                errorData =
                    await response.json();

            } catch {

                errorData = {};

            }


            throw new Error(
                extractError(
                    errorData
                )
            );

        }


        // ====================================================
        // Получаем Excel
        // ====================================================

        const blob =
            await response.blob();


        // ====================================================
        // Скачивание
        // ====================================================

        const url =
            window.URL.createObjectURL(
                blob
            );


        const a =
            document.createElement(
                'a'
            );


        a.href =
            url;


        a.download =
            `driver-report-${from}-${to}.xlsx`;


        document.body.appendChild(
            a
        );


        a.click();


        a.remove();


        window.URL.revokeObjectURL(
            url
        );


    } catch (error) {


        console.error(
            error
        );


        alert(
            'Ошибка создания Excel:\n\n' +
            error.message
        );


    } finally {


        excelBtn.disabled =
            false;


        excelBtn.textContent =
            'Скачать Excel';

    }

}


// ============================================================
// ФОРМАТ ДЕНЕГ
// ============================================================

function formatMoney(value) {


    const number =
        Number(value || 0);


    if (!Number.isFinite(number)) {

        return '0,00 ₽';

    }


    return number
        .toLocaleString(
            'ru-RU',
            {

                minimumFractionDigits:
                    2,

                maximumFractionDigits:
                    2

            }
        ) + ' ₽';

}


// ============================================================
// ФОРМАТ ДАТЫ
// ============================================================

function formatDate(value) {


    if (!value) {

        return '';

    }


    const parts =
        String(value)
            .split('-');


    if (
        parts.length !== 3
    ) {

        return value;

    }


    return (

        parts[2] +
        '.' +
        parts[1] +
        '.' +
        parts[0]

    );

}


// ============================================================
// ТЕКСТ ОШИБКИ
// ============================================================

function extractError(data) {


    if (!data) {

        return 'Неизвестная ошибка';

    }


    if (
        typeof data.error === 'string'
    ) {

        return data.error;

    }


    if (
        data.error?.errors?.length
    ) {

        return data.error.errors
            .map(
                error =>
                    error.error ||
                    error.message ||
                    'Ошибка'
            )
            .join('\n');

    }


    if (
        data.errors?.length
    ) {

        return data.errors
            .map(
                error =>
                    error.error ||
                    error.message ||
                    'Ошибка'
            )
            .join('\n');

    }


    return (
        data.message ||
        'Неизвестная ошибка'
    );

}


// ============================================================
// HTML ESCAPE
// ============================================================

function escapeHtml(value) {


    return String(
        value ?? ''
    )

        .replace(
            /&/g,
            '&amp;'
        )

        .replace(
            /</g,
            '&lt;'
        )

        .replace(
            />/g,
            '&gt;'
        )

        .replace(
            /"/g,
            '&quot;'
        )

        .replace(
            /'/g,
            '&#039;'
        );

}
