<!DOCTYPE html>

<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Отчёт по водителям
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            background: #f5f7fb;

            color: #20242c;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

        }


        .container {

            max-width: 1450px;

            margin: 0 auto;

            padding:
                35px 20px 50px;

        }


        h1 {

            margin:
                0 0 25px;

            font-size: 30px;

            font-weight: 700;

        }


        .card {

            background: white;

            border-radius: 16px;

            padding: 25px;

            margin-bottom: 20px;

            box-shadow:
                0 4px 20px
                rgba(0, 0, 0, .06);

        }


        /* ====================================================
           ФИЛЬТРЫ
           ==================================================== */

        .filters {

            display: flex;

            align-items: end;

            gap: 15px;

            flex-wrap: wrap;

        }


        .field {

            display: flex;

            flex-direction: column;

            gap: 7px;

        }


        .field label {

            font-size: 13px;

            color: #6b7280;

            font-weight: 600;

        }


        input[type="date"] {

            height: 44px;

            padding:
                0 12px;

            border:
                1px solid #d8dce5;

            border-radius: 9px;

            background: white;

            font-size: 15px;

            color: #20242c;

        }


        input[type="date"]:focus {

            outline: none;

            border-color: #2563eb;

        }


        /* ====================================================
           КНОПКИ
           ==================================================== */

        button {

            height: 44px;

            padding:
                0 22px;

            border: 0;

            border-radius: 9px;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            transition:
                background .15s,
                opacity .15s;

        }


        #loadBtn {

            background: #2563eb;

            color: white;

        }


        #loadBtn:hover {

            background: #1d4ed8;

        }


        #excelBtn {

            display: none;

            background: #16a34a;

            color: white;

        }


        #excelBtn:hover {

            background: #15803d;

        }


        button:disabled {

            opacity: .6;

            cursor: wait;

        }


        /* ====================================================
           СТАТУС
           ==================================================== */

        .status {

            margin-top: 18px;

            font-size: 14px;

            color: #6b7280;

        }


        /* ====================================================
           ИТОГ
           ==================================================== */

        .summary {

            display: none;

            gap: 15px;

            margin-top: 20px;

        }


        .summary-item {

            padding:
                14px 20px;

            background: #f5f7fb;

            border-radius: 10px;

        }


        .summary-title {

            color: #6b7280;

            font-size: 13px;

        }


        .summary-value {

            margin-top: 4px;

            font-size: 24px;

            font-weight: 700;

        }


        /* ====================================================
           ТАБЛИЦА
           ==================================================== */

        .table-wrap {

            overflow-x: auto;

        }


        table {

            width: 100%;

            border-collapse: collapse;

            font-size: 14px;

        }


        th {

            padding:
                13px;

            background: #f3f4f6;

            text-align: left;

            white-space: nowrap;

            font-weight: 600;

        }


        td {

            padding:
                12px 13px;

            border-top:
                1px solid #edf0f4;

            vertical-align: top;

        }


        tbody tr:hover td {

            background: #fafafa;

        }


        .positive {

            color: #15803d;

            font-weight: 600;

        }


        .negative {

            color: #dc2626;

            font-weight: 600;

        }


        .empty {

            text-align: center;

            padding: 50px;

            color: #9ca3af;

        }


        /* ====================================================
           LOADER
           ==================================================== */

        .loader {

            display: inline-block;

            width: 15px;

            height: 15px;

            margin-right: 7px;

            border:
                2px solid
                rgba(255, 255, 255, .4);

            border-top-color: white;

            border-radius: 50%;

            animation:
                spin .7s linear infinite;

            vertical-align: -2px;

        }


        @keyframes spin {

            to {

                transform:
                    rotate(360deg);

            }

        }


        /* ====================================================
           МОБИЛЬНАЯ ВЕРСИЯ
           ==================================================== */

        @media (max-width: 700px) {

            .container {

                padding:
                    20px 12px;

            }


            .filters {

                flex-direction: column;

                align-items: stretch;

            }


            .field,
            input,
            button {

                width: 100%;

            }


            .summary {

                flex-direction: column;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- ====================================================
         ЗАГОЛОВОК
         ==================================================== -->

    <h1>
        Отчёт по водителям
    </h1>


    <!-- ====================================================
         ФИЛЬТР
         ==================================================== -->

    <div class="card">


        <div class="filters">


            <!-- Дата начала -->

            <div class="field">

                <label>
                    Дата начала
                </label>

                <input
                    type="date"
                    id="from"
                >

            </div>


            <!-- Дата окончания -->

            <div class="field">

                <label>
                    Дата окончания
                </label>

                <input
                    type="date"
                    id="to"
                >

            </div>


            <!-- Получить -->

            <button
                id="loadBtn"
                onclick="loadReport()"
            >
                Получить отчёт
            </button>


            <!-- Excel -->

            <button
                id="excelBtn"
                onclick="downloadExcel()"
            >
                Скачать Excel
            </button>


        </div>


        <!-- Статус -->

        <div
            class="status"
            id="status"
        ></div>


        <!-- Итог -->

        <div
            class="summary"
            id="summary"
        >

            <div class="summary-item">

                <div class="summary-title">
                    Строк отчёта
                </div>

                <div
                    class="summary-value"
                    id="count"
                >
                    0
                </div>

            </div>

        </div>


    </div>


    <!-- ====================================================
         ТАБЛИЦА
         ==================================================== -->

    <div class="card">


        <div class="table-wrap">


            <table>


                <thead>

                    <tr>

                        <th>
                            Дата
                        </th>

                        <th>
                            Контрагент
                        </th>

                        <th>
                            Водитель
                        </th>

                        <th>
                            Счёт
                        </th>

                        <th>
                            Сумма счета
                        </th>

                        <th>
                            Сумма отгрузок
                        </th>

                        <th>
                            Разница
                        </th>

                        <th>
                            Отгрузки
                        </th>

                    </tr>

                </thead>


                <tbody id="tableBody">


                    <tr>

                        <td
                            colspan="8"
                            class="empty"
                        >

                            Выберите период и нажмите
                            «Получить отчёт»

                        </td>

                    </tr>


                </tbody>


            </table>


        </div>


    </div>


</div>


<script>


// ============================================================
// ТЕКУЩИЙ ПОЛУЧЕННЫЙ ОТЧЁТ
//
// ВАЖНО:
//
// После получения отчёта данные остаются
// в браузере.
//
// При скачивании Excel они отправляются
// на сервер.
//
// МойСклад повторно НЕ вызывается.
// ============================================================

let currentReport = [];


// ============================================================
// ЭЛЕМЕНТЫ
// ============================================================

const fromInput =
    document.getElementById('from');

const toInput =
    document.getElementById('to');

const loadBtn =
    document.getElementById('loadBtn');

const excelBtn =
    document.getElementById('excelBtn');

const status =
    document.getElementById('status');

const summary =
    document.getElementById('summary');

const count =
    document.getElementById('count');

const tableBody =
    document.getElementById('tableBody');


// ============================================================
// СЕГОДНЯ
// ============================================================

const today =
    new Date();


const todayString =
    today.toISOString()
        .substring(0, 10);


// ============================================================
// ПЕРВЫЙ ДЕНЬ ТЕКУЩЕГО МЕСЯЦА
// ============================================================

const firstDay =
    new Date(
        today.getFullYear(),
        today.getMonth(),
        1
    );


const firstDayString =
    firstDay
        .toISOString()
        .substring(0, 10);


// ============================================================
// ЗНАЧЕНИЯ ПО УМОЛЧАНИЮ
// ============================================================

fromInput.value =
    firstDayString;

toInput.value =
    todayString;


// ============================================================
// ПОЛУЧИТЬ ОТЧЁТ
// ============================================================

async function loadReport() {


    const from =
        fromInput.value;

    const to =
        toInput.value;


    // --------------------------------------------------------
    // Проверка
    // --------------------------------------------------------

    if (!from || !to) {

        alert(
            'Выберите период'
        );

        return;

    }


    if (from > to) {

        alert(
            'Дата начала не может быть позже даты окончания'
        );

        return;

    }


    // --------------------------------------------------------
    // Сбрасываем старые данные
    // --------------------------------------------------------

    currentReport = [];


    excelBtn.style.display =
        'none';


    summary.style.display =
        'none';


    // --------------------------------------------------------
    // UI
    // --------------------------------------------------------

    loadBtn.disabled =
        true;


    loadBtn.innerHTML =
        '<span class="loader"></span>Загрузка...';


    status.textContent =
        'Получаем данные из МойСклад...';


    tableBody.innerHTML = `

        <tr>

            <td
                colspan="8"
                class="empty"
            >

                Загрузка данных...

            </td>

        </tr>

    `;


    try {


        // ====================================================
        // ЗАПРОС
        // ====================================================

        const url =
            `/api/driver-report?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`;


        const response =
            await fetch(url);


        const data =
            await response.json();


        // ====================================================
        // ОШИБКА
        // ====================================================

        if (!response.ok) {

            throw new Error(
                extractError(data)
            );

        }


        // ====================================================
        // СОХРАНЯЕМ ОТЧЁТ
        // ====================================================

        currentReport =
            data.rows || [];


        // ====================================================
        // ПОКАЗЫВАЕМ
        // ====================================================

        renderReport(
            currentReport
        );


        count.textContent =
            currentReport.length;


        summary.style.display =
            'flex';


        // ====================================================
        // КНОПКА EXCEL
        // ====================================================

        if (currentReport.length > 0) {

            excelBtn.style.display =
                'inline-block';

        }


        status.textContent =
            `Период: ${formatDate(from)} — ${formatDate(to)}`;


    } catch (error) {


        console.error(
            error
        );


        currentReport = [];


        tableBody.innerHTML = `

            <tr>

                <td
                    colspan="8"
                    class="empty"
                >

                    Ошибка:
                    ${escapeHtml(error.message)}

                </td>

            </tr>

        `;


        status.textContent =
            'Ошибка получения данных';


    } finally {


        loadBtn.disabled =
            false;


        loadBtn.textContent =
            'Получить отчёт';

    }

}


// ============================================================
// СКАЧАТЬ EXCEL
//
// ВАЖНО:
//
// Здесь НЕТ запроса к МойСклад.
//
// Мы отправляем уже полученный currentReport.
// ============================================================

async function downloadExcel() {


    if (
        !currentReport.length
    ) {

        alert(
            'Сначала получите отчёт'
        );

        return;

    }


    const from =
        fromInput.value;

    const to =
        toInput.value;


    try {


        // ----------------------------------------------------
        // UI
        // ----------------------------------------------------

        excelBtn.disabled =
            true;


        excelBtn.textContent =
            'Формируем Excel...';


        // ====================================================
        // ОТПРАВЛЯЕМ ГОТОВЫЕ ДАННЫЕ
        // ====================================================

        const response =
            await fetch(
                '/api/driver-report.xlsx',
                {

                    method:
                        'POST',

                    headers: {

                        'Content-Type':
                            'application/json'

                    },

                    body:
                        JSON.stringify({

                            from,

                            to,

                            rows:
                                currentReport

                        })

                }
            );


        // ====================================================
        // ОШИБКА
        // ====================================================

        if (!response.ok) {

            let errorData;


            try {

                errorData =
                    await response.json();

            } catch {

                errorData = {};

            }


            throw new Error(
                extractError(
                    errorData
                )
            );

        }


        // ====================================================
        // ПОЛУЧАЕМ ФАЙЛ
        // ====================================================

        const blob =
            await response.blob();


        // ====================================================
        // СОЗДАЁМ ССЫЛКУ
        // ====================================================

        const url =
            window.URL.createObjectURL(
                blob
            );


        const a =
            document.createElement('a');


        a.href =
            url;


        a.download =
            `driver-report-${from}-${to}.xlsx`;


        document.body.appendChild(a);


        a.click();


        a.remove();


        window.URL.revokeObjectURL(
            url
        );


    } catch (error) {


        console.error(
            error
        );


        alert(
            'Ошибка создания Excel:\n\n' +
            error.message
        );


    } finally {


        excelBtn.disabled =
            false;


        excelBtn.textContent =
            'Скачать Excel';

    }

}


// ============================================================
// ОТОБРАЗИТЬ ТАБЛИЦУ
// ============================================================

function renderReport(rows) {


    if (!rows.length) {

        tableBody.innerHTML = `

            <tr>

                <td
                    colspan="8"
                    class="empty"
                >

                    За выбранный период
                    данных нет

                </td>

            </tr>

        `;

        return;

    }


    tableBody.innerHTML =

        rows
            .map(row => {


                const difference =
                    Number(
                        row.difference || 0
                    );


                let differenceClass =
                    '';


                if (
                    difference > 0
                ) {

                    differenceClass =
                        'positive';

                }


                if (
                    difference < 0
                ) {

                    differenceClass =
                        'negative';

                }


                // --------------------------------------------
                // Отгрузки
                // --------------------------------------------

                const demands =
                    (row.demands || [])
                        .map(
                            demand => `

                                <div>

                                    ${escapeHtml(
                                        demand.number
                                    )}

                                    —

                                    ${formatMoney(
                                        demand.sum
                                    )}

                                </div>

                            `
                        )
                        .join('');


                // --------------------------------------------
                // Строка
                // --------------------------------------------

                return `

                    <tr>

                        <td>

                            ${formatDate(
                                row.date
                            )}

                        </td>


                        <td>

                            ${escapeHtml(
                                row.counterparty
                            )}

                        </td>


                        <td>

                            ${escapeHtml(
                                row.driver
                            )}

                        </td>


                        <td>

                            ${escapeHtml(
                                row.invoice
                            )}

                        </td>


                        <td>

                            ${formatMoney(
                                row.invoiceSum
                            )}

                        </td>


                        <td>

                            ${formatMoney(
                                row.shipmentSum
                            )}

                        </td>


                        <td
                            class="${differenceClass}"
                        >

                            ${formatMoney(
                                difference
                            )}

                        </td>


                        <td>

                            ${demands}

                        </td>

                    </tr>

                `;

            })
            .join('');

}


// ============================================================
// ФОРМАТ ДЕНЕГ
// ============================================================

function formatMoney(value) {

    return Number(
        value || 0
    )
        .toLocaleString(
            'ru-RU',
            {

                minimumFractionDigits:
                    2,

                maximumFractionDigits:
                    2

            }
        ) + ' ₽';

}


// ============================================================
// ФОРМАТ ДАТЫ
// ============================================================

function formatDate(value) {


    if (!value) {
        return '';
    }


    const parts =
        String(value).split('-');


    if (
        parts.length !== 3
    ) {

        return value;

    }


    return (
        parts[2] +
        '.' +
        parts[1] +
        '.' +
        parts[0]
    );

}


// ============================================================
// ПОЛУЧИТЬ ТЕКСТ ОШИБКИ
// ============================================================

function extractError(data) {


    if (!data) {

        return 'Неизвестная ошибка';

    }


    if (
        typeof data.error === 'string'
    ) {

        return data.error;

    }


    if (
        data.error?.errors?.length
    ) {

        return data.error.errors
            .map(
                error =>
                    error.error ||
                    error.message ||
                    'Ошибка'
            )
            .join('\n');

    }


    if (
        data.errors?.length
    ) {

        return data.errors
            .map(
                error =>
                    error.error ||
                    error.message ||
                    'Ошибка'
            )
            .join('\n');

    }


    return (
        data.message ||
        'Неизвестная ошибка'
    );

}


// ============================================================
// ЭКРАНИРОВАНИЕ HTML
// ============================================================

function escapeHtml(value) {

    return String(
        value ?? ''
    )
        .replace(
            /&/g,
            '&amp;'
        )
        .replace(
            /</g,
            '&lt;'
        )
        .replace(
            />/g,
            '&gt;'
        )
        .replace(
            /"/g,
            '&quot;'
        )
        .replace(
            /'/g,
            '&#039;'
        );

}

</script>


</body>

</html>
